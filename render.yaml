# One-click setup on Render: New → Blueprint → pick this repo.
databases:
  - name: herhaus-db
    plan: 0.1c-256mb          # smallest paid Postgres; includes automatic backups / point-in-time recovery
    region: singapore         # same region as the web service (fast private connection)
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: herhaus
    user: herhaus
    ipAllowList: []           # no public internet access — only the Hub (on Render's private network) connects

services:
  - type: web
    name: herhaus-hub
    runtime: python
    plan: 0.5c-512mb         # smallest paid size (0.5 CPU, 512 MB); needed for the persistent disk below
    region: singapore        # closest to the Philippines; change if you prefer
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 --timeout 60 --access-logfile - --log-level info -b 0.0.0.0:$PORT app:app
    disk:
      name: herhaus-data
      mountPath: /var/data   # database + all uploads live here and survive redeploys
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /var/data      # uploaded files live on the disk; data lives in Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: herhaus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false          # Render asks for this when you create the service
